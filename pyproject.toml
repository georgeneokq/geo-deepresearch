[project]
name = "geo-deepresearch"
version = "0.1.0"
description = "Geo DeepResearch"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.5.3",
    "fastapi>=0.135.1",
    "langchain-text-splitters>=1.1.1",
    "langfuse>=3.14.5",
    "openai>=2.26.0",
    "requests>=2.32.5",
    "transformers>=5.2.0",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "langfuse>=3.14.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_deepresearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: LLM behavioural testing with live LLM calls",
    "e2e: End-to-end tests with live LLM calls"
]
testpaths = ["tests"]
